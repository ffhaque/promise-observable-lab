name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Angular app
        run: npm run build -- --base-href "/promise-observable-lab/"

      - name: Find Angular output
        id: output
        shell: bash
        run: |
          INDEX_FILE=$(find dist -type f -path "*/browser/index.html" -print -quit)

          if [ -z "$INDEX_FILE" ]; then
            INDEX_FILE=$(find dist -type f -name "index.html" -print -quit)
          fi

          if [ -z "$INDEX_FILE" ]; then
            echo "Could not find Angular index.html"
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")

          echo "Angular output: $OUTPUT_DIR"
          echo "path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
